# NEX — Nginx reverse proxy configuration
#
# Traffic flow:
#   Browser / CLI → (TLS LB) → Nginx :80 → Django backend :8000
#
# The agent-runtime is an internal-only service and is NOT proxied by Nginx.
# All agent interactions are initiated by the Django backend over the internal
# Docker network.
#
# ─────────────────────────────────────────────────────────────────────────────
# TLS note
# ─────────────────────────────────────────────────────────────────────────────
# TLS termination is NOT configured in this file. Place a TLS-terminating load
# balancer (AWS ALB, GCP HTTPS LB, Cloudflare, or a separate Nginx with certs)
# in front of this instance. See infrastructure/nginx/README.md for the full
# production TLS and HTTP→HTTPS redirect checklist.
#
# HTTP → HTTPS redirect must be enforced at the LB / Nginx TLS layer, not by
# Django (Django's SECURE_SSL_REDIRECT is intentionally disabled to avoid
# redirect loops — see apps/backend/config/settings/production.py).
#
# ─────────────────────────────────────────────────────────────────────────────
# X-Forwarded-Proto policy
# ─────────────────────────────────────────────────────────────────────────────
# Nginx sets X-Forwarded-Proto: https unconditionally.
# Rationale: Nginx is trusted infrastructure — it is the only proxy between the
# TLS-terminating load balancer and Django. Any request reaching Nginx has
# already been validated by the LB as HTTPS. Setting the header to "https"
# lets Django correctly enforce secure cookies, HSTS headers, and CSRF
# protection even though the Nginx → Django leg is HTTP on the internal network.
#
# Deployment assumption: Nginx is NEVER directly reachable from the public
# internet without a TLS LB in front of it. During development (no TLS LB),
# traffic is HTTP-only and HTTPS enforcement is not active.

worker_processes auto;

# Send error logs to stderr — Docker captures these in the container log stream.
error_log /dev/stderr warn;

# PID file in /tmp — required if Nginx is configured to run as a non-root user.
# The stock nginx:alpine image runs as root; /tmp/nginx.pid is used for
# compatibility with future hardening that runs Nginx as a non-root user.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # Basic settings
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version from all responses and error pages.
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Request body size limit — prevent large-payload abuse.
    # Increase per-endpoint only when a specific use case requires it.
    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # Logging — structured JSON to stdout; query strings excluded
    #
    # $uri is used instead of $request_uri.
    # $request_uri includes the raw query string, which may contain sensitive
    # values (password reset tokens, API keys, session parameters).
    # $uri contains only the decoded path without query parameters.
    # -------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    # http_referer is intentionally excluded — referrer URLs can contain
    # sensitive path segments or tokens from the originating page.

    access_log /dev/stdout json_combined;

    # -------------------------------------------------------------------------
    # Upstream: Django backend
    # Internal Docker DNS resolves "backend" to the backend container.
    # -------------------------------------------------------------------------
    upstream backend {
        server backend:8000;
        # keepalive: reuse connections to the upstream for performance.
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Server block
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;

        # server_name _ accepts any Host header.
        # In production, replace with the actual public domain name to prevent
        # serving responses to requests with arbitrary Host headers:
        #   server_name nex.example.com;
        server_name _;

        # -----------------------------------------------------------------
        # Security headers — applied to all responses
        # -----------------------------------------------------------------
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "DENY"            always;
        add_header Referrer-Policy         "no-referrer"     always;

        # -----------------------------------------------------------------
        # Proxy timeouts
        # -----------------------------------------------------------------
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
        proxy_buffering        on;

        # -----------------------------------------------------------------
        # Forwarding headers
        # -----------------------------------------------------------------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Set X-Forwarded-Proto: https unconditionally.
        # See the X-Forwarded-Proto policy note at the top of this file.
        # During development (HTTP-only, no TLS LB), Django's secure-cookie
        # and HSTS settings are not active, so this does not cause harm.
        proxy_set_header X-Forwarded-Proto "https";

        proxy_http_version 1.1;
        proxy_set_header Connection "";   # HTTP/1.1 keepalives to upstream

        # -----------------------------------------------------------------
        # Routes
        # -----------------------------------------------------------------

        # Django backend — all application traffic
        location / {
            proxy_pass http://backend;

            # Suppress upstream error pages; return a controlled JSON response.
            proxy_intercept_errors on;
            error_page 502 503 504 = @upstream_error;
        }

        # Nginx liveness check — served by Nginx itself (no upstream dependency).
        # Used by load balancers and Docker health checks.
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json always;
        }

        # Controlled error response for upstream failures.
        # Returns structured JSON without leaking internal service details.
        location @upstream_error {
            internal;
            default_type application/json;
            return 503 '{"error":"service_unavailable","message":"The service is temporarily unavailable. Please try again later."}';
        }
    }
}
